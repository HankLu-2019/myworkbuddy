# Development: source mounted with hot reload. Omit with `docker compose -f docker-compose.yml up` for prod-like runs.
services:
  migrate:
    build:
      context: ./backend
      target: dev
    image: myworkbuddy-backend:dev
    environment:
      MWB_ENV: dev
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  api:
    build:
      context: ./backend
      target: dev
    image: myworkbuddy-backend:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--proxy-headers", "--forwarded-allow-ips=${MWB_EDGE_PREFIX:-172.30.0}.200"]
    environment:
      MWB_ENV: dev
      MWB_SMTP_HOST: mailpit
      MWB_SMTP_PORT: "1025"
      MWB_SMTP_STARTTLS: "false"
      MWB_SMTP_FROM: MyWorkBuddy <mwb@localhost>
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - mwbdata:/data

  worker:
    build:
      context: ./backend
      target: dev
    image: myworkbuddy-backend:dev
    environment:
      MWB_ENV: dev
      MWB_SMTP_HOST: mailpit
      MWB_SMTP_PORT: "1025"
      MWB_SMTP_STARTTLS: "false"
      MWB_SMTP_FROM: MyWorkBuddy <mwb@localhost>
    command: ["sh", "-c", "mwb check-config && { mwb wiki-reconcile || echo wiki-reconcile failed, continuing; } && exec watchfiles --filter python 'procrastinate --app=app.tasks.app.app worker --concurrency=4' /app/app"]
    volumes:
      - ./backend/app:/app/app
      - mwbdata:/data

  web:
    build:
      context: ./frontend
      target: dev
    image: myworkbuddy-web:dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  # Dev: plain HTTP on localhost:8080; Caddy still routes /api and adds the same headers as production.
  caddy:
    environment:
      MWB_HOSTNAME: http://localhost:8080
      MWB_TLS_MODE: none
      # Vite's dev server injects an inline script (React refresh) and uses a websocket for HMR.
      MWB_CSP: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    ports: !override
      - "8080:8080"
