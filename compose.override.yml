# Development: source mounted with hot reload. Omit with `docker compose -f docker-compose.yml up` for prod-like runs.
services:
  migrate:
    build:
      context: ./backend
      target: dev
    image: myworkbuddy-backend:dev
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  api:
    build:
      context: ./backend
      target: dev
    image: myworkbuddy-backend:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - mwbdata:/data
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      target: dev
    image: myworkbuddy-backend:dev
    command: ["watchfiles", "--filter", "python", "procrastinate --app=app.tasks.app.app worker --concurrency=4", "/app/app"]
    volumes:
      - ./backend/app:/app/app
      - mwbdata:/data

  web:
    build:
      context: ./frontend
      target: dev
    image: myworkbuddy-web:dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    environment:
      MWB_API_URL: http://api:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
