# CI and local end-to-end runs: the LLM gateway is replaced by a deterministic fake (backend/tests/fakellm).
#   docker compose -f docker-compose.yml -f compose.ci.yml up -d --build --wait
services:
  llm-gateway:
    image: myworkbuddy-backend:dev
    build:
      context: ./backend
      target: dev
    command: ["uvicorn", "tests.fakellm.server:app", "--host", "0.0.0.0", "--port", "4000"]
    env_file: !reset []
    volumes: !reset []

  api:
    environment:
      MWB_ENV: dev
      MWB_ALLOW_HTTP_INTEGRATIONS: "true"  # the fake GitLab is the fake gateway over plain HTTP
      MWB_ALLOW_HTTP_REPOS: "true"  # and so is its Git server (07 §5.8)
  worker:
    environment:
      MWB_ENV: dev
      MWB_ALLOW_HTTP_INTEGRATIONS: "true"
      MWB_ALLOW_HTTP_REPOS: "true"
  migrate:
    environment:
      MWB_ENV: dev
  backup:
    environment:
      MWB_ENV: dev

  caddy:
    environment:
      MWB_HOSTNAME: http://localhost:8080
      MWB_TLS_MODE: none
    ports: !override
      - "8080:8080"
