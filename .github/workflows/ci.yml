name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with docker-compose.yml.
  PARADEDB_IMAGE: paradedb/paradedb:0.26.0-pg17

jobs:
  backend-lint:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check . > ../lint.log 2>&1 || { cat ../lint.log; exit 1; }
      - run: uv run --frozen ruff format --check . > ../format.log 2>&1 || { cat ../format.log; exit 1; }
      - if: failure()
        working-directory: .
        run: |
          .github/scripts/annotate-tail.sh "ruff check" lint.log
          .github/scripts/annotate-tail.sh "ruff format" format.log

  backend-test:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: paradedb/paradedb:0.26.0-pg17
        env: { POSTGRES_USER: mwb, POSTGRES_PASSWORD: mwb, POSTGRES_DB: mwb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mwb -d mwb" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MWB_DATABASE_URL: postgresql://mwb:mwb@localhost:5432/mwb
      MWB_SECRET_KEY: ci-placeholder-overridden-by-conftest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - name: Backup tools (pg_dump 17, restic) for tests/test_ops.py
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 restic > /dev/null
          pg_dump --version && restic version
      - name: pytest
        env:
          MWB_REQUIRE_BACKUP_TOOLS: "1"  # fail rather than skip the backup round trip
        run: uv run --frozen pytest --cov=app --cov-report=term --cov-fail-under=80 -p no:cacheprovider > ../pytest.log 2>&1; status=$?; tail -n 80 ../pytest.log; exit $status
      - if: failure()
        working-directory: .
        run: |
          grep -E "^(FAILED|ERROR) |^E  |^tests/.*:[0-9]+: " pytest.log | head -n 120 > pytest-failures.log
          .github/scripts/annotate-tail.sh "pytest failures" pytest-failures.log 120
          .github/scripts/annotate-tail.sh "pytest" pytest.log 80

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck > ../typecheck.log 2>&1 || { cat ../typecheck.log; exit 1; }
      - run: npx vitest run --coverage > ../vitest.log 2>&1 || { cat ../vitest.log; exit 1; }
      - run: npm run build > ../build.log 2>&1 || { cat ../build.log; exit 1; }
      - name: Initial JavaScript within budget (07 §8)
        run: npm run -s size > ../size.log 2>&1; status=$?; cat ../size.log; exit $status
      - uses: astral-sh/setup-uv@v6
      - name: Generated API types match the backend (07 §8)
        run: |
          (cd ../backend && uv sync --frozen > /dev/null)
          npm run -s api:check > ../api-types.log 2>&1; status=$?; cat ../api-types.log; exit $status
      - if: failure()
        working-directory: .
        run: |
          for f in typecheck vitest build size api-types; do [ -f "$f.log" ] && .github/scripts/annotate-tail.sh "$f" "$f.log" 40; done

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          set -o pipefail
          { docker build --target prod -t mwb-backend:prod backend \
            && docker build --target dev -t mwb-backend:dev backend \
            && docker build --target prod -t mwb-web:prod frontend; } > images.log 2>&1 || { tail -n 80 images.log; exit 1; }
      - name: Caddyfile is valid in every TLS mode
        run: |
          mkdir -p tls && openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=mwb.example.com -keyout tls/key.pem -out tls/cert.pem 2>/dev/null
          for mode in files internal none; do
            host=https://mwb.example.com; [ $mode = none ] && host=http://localhost:8080
            docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" -v "$PWD/tls:/tls:ro" -e MWB_HOSTNAME=$host -e MWB_TLS_MODE=$mode \
              -e "MWB_CSP=default-src 'self'" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile >> images.log 2>&1 \
              || { echo "caddy validate failed for $mode" >> images.log; tail -n 40 images.log; exit 1; }
          done
      - name: Prod backend image has no dev tooling
        run: |
          if docker run --rm mwb-backend:prod python -c "import pytest" 2>/dev/null; then echo "pytest found in prod image" > images.log; exit 1; fi
          docker run --rm -e MWB_DATABASE_URL=postgresql://x@localhost/x -e MWB_SECRET_KEY=x -e MWB_HOSTNAME=https://mwb.example.com mwb-backend:prod python -c "import app.main" > images.log 2>&1 || { cat images.log; exit 1; }
      - if: failure()
        run: .github/scripts/annotate-tail.sh "images" images.log 80

  # Backups and restores for real (design 01 §H14): seed data, back up to a local restic repository, restore
  # into a second compose project, and check users, a wiki page and a stored token survived.
  ops:
    runs-on: ubuntu-24.04
    needs: [images]
    env:
      MWB_E2E_ADMIN_PASSWORD: admin-password-1
      COMPOSE: docker compose -f docker-compose.yml -f compose.ci.yml
    steps:
      - uses: actions/checkout@v5
      - name: Write .env
        run: |
          cp .env.example .env
          key=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres|; s|^MWB_SECRET_KEY=.*|MWB_SECRET_KEY=$key|; s|^MWB_COOKIE_SECURE=.*|MWB_COOKIE_SECURE=false|; s|^MWB_HOSTNAME=.*|MWB_HOSTNAME=http://localhost:8080|; s|^MWB_TLS_MODE=.*|MWB_TLS_MODE=none|; s|^LITELLM_MASTER_KEY=.*|LITELLM_MASTER_KEY=sk-ci|; s|^LITELLM_DB_PASSWORD=.*|LITELLM_DB_PASSWORD=ci-litellm|" .env
          sed -i 's|^MWB_BACKUP_REPO=.*|MWB_BACKUP_REPO=/backup-local/repo|; s|^RESTIC_PASSWORD=.*|RESTIC_PASSWORD=ci-restic|' .env
          grep -c '^MWB_BACKUP_REPO=/backup-local/repo' .env
          mkdir -p backups && sudo chown 1000:1000 backups
      - name: Start api and worker
        run: $COMPOSE up -d --build --wait --wait-timeout 300 api worker > ops.log 2>&1 || { $COMPOSE logs --tail 40 migrate api worker >> ops.log 2>&1; cat ops.log; exit 1; }
      - name: Seed data and check readiness
        run: |
          $COMPOSE exec -T -e MWB_ADMIN_PASSWORD=$MWB_E2E_ADMIN_PASSWORD api mwb create-admin --username admin >> ops.log 2>&1
          $COMPOSE exec -T -e MWB_E2E_ADMIN_PASSWORD api python - < deploy/ci/seed.py | tee -a ops.log
          $COMPOSE exec -T worker mwb worker-health | tee -a ops.log
      - name: Back up and inspect the snapshot
        run: |
          $COMPOSE build backup >> ops.log 2>&1
          $COMPOSE run --rm backup now 2>&1 | tee -a ops.log
          $COMPOSE run --rm backup list latest > snapshot.txt 2>&1 || { cat snapshot.txt >> ops.log; exit 1; }
          for f in mwb.dump litellm.dump data.tar; do grep -q "/$f$" snapshot.txt || { echo "snapshot lacks $f" | tee -a ops.log; cat snapshot.txt >> ops.log; exit 1; }; done
      - name: Restore into a second stack (drill)
        env:
          COMPOSE_PROJECT_NAME: mwb-drill
          MWB_EDGE_PREFIX: 172.31.0
          MWB_COMPOSE_FILES: -f compose.ci.yml
          MWB_RESTORE_SERVICES: api worker
        run: deploy/restore.sh --snapshot latest 2>&1 | tee -a ops.log
      - name: Check the restored data
        env:
          COMPOSE_PROJECT_NAME: mwb-drill
          MWB_EDGE_PREFIX: 172.31.0
        run: |
          report=$($COMPOSE exec -T api mwb backup verify-restore)
          echo "$report" | tee -a ops.log
          python3 -c "import json,sys; r=json.loads(sys.argv[1]); assert r['users'] >= 2 and r['wiki_pages'] >= 1 and r['wiki_files_ok'] == r['wiki_pages'] and r['secrets'] >= 1 and r['secrets_readable'] == r['secrets'], r" "$report"
          $COMPOSE exec -T api mwb backup record-drill --ok --note "CI drill" | tee -a ops.log
      - if: failure()
        run: |
          { $COMPOSE logs --tail 30 backup api worker migrate; COMPOSE_PROJECT_NAME=mwb-drill MWB_EDGE_PREFIX=172.31.0 $COMPOSE logs --tail 30 api worker migrate; } >> ops.log 2>&1 || true
          .github/scripts/annotate-tail.sh "ops" ops.log 120

  e2e:
    runs-on: ubuntu-24.04
    needs: [images]
    permissions:
      contents: write # only to commit missing visual baselines to the PR branch
    env:
      MWB_E2E_ADMIN_PASSWORD: admin-password-1
    steps:
      - uses: actions/checkout@v5
      - name: Write .env
        run: |
          cp .env.example .env
          key=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres|; s|^MWB_SECRET_KEY=.*|MWB_SECRET_KEY=$key|; s|^MWB_COOKIE_SECURE=.*|MWB_COOKIE_SECURE=false|; s|^MWB_HOSTNAME=.*|MWB_HOSTNAME=http://localhost:8080|; s|^MWB_TLS_MODE=.*|MWB_TLS_MODE=none|; s|^LITELLM_MASTER_KEY=.*|LITELLM_MASTER_KEY=sk-ci|; s|^LITELLM_DB_PASSWORD=.*|LITELLM_DB_PASSWORD=ci-litellm|" .env
      - name: Start stack with the fake LLM
        run: docker compose -f docker-compose.yml -f compose.ci.yml up -d --build --wait --wait-timeout 300 api worker web caddy > stack.log 2>&1 || { cat stack.log; { docker compose -f docker-compose.yml -f compose.ci.yml ps -a; docker compose -f docker-compose.yml -f compose.ci.yml logs --tail 25 migrate api worker web caddy llm-gateway; } > stack-state.log 2>&1; grep -i -E 'error|denied|invalid|conflict|failed|address' stack.log | tail -n 15 > stack-err.log; mv stack-err.log stack.log; cat stack-state.log >> stack.log; cat stack.log; exit 1; }
      - name: Create admin
        run: docker compose -f docker-compose.yml -f compose.ci.yml exec -T -e MWB_ADMIN_PASSWORD=$MWB_E2E_ADMIN_PASSWORD api mwb create-admin --username admin --email admin@example.com
      - name: Edge sends security headers and ignores forged X-Forwarded-For
        run: |
          set -o pipefail
          curl -sfI http://localhost:8080/ > headers.txt
          for h in content-security-policy x-content-type-options referrer-policy permissions-policy; do
            grep -qi "^$h:" headers.txt || { echo "missing header $h" | tee edge.log; cat headers.txt >> edge.log; exit 1; }
          done
          grep -qi "img-src 'self' data:" headers.txt || { echo "CSP does not restrict images" | tee edge.log; exit 1; }
          if grep -qi "^server:" headers.txt; then echo "Server header leaked" | tee edge.log; exit 1; fi
          curl -s -o /dev/null -H 'content-type: application/json' -H 'X-Forwarded-For: 203.0.113.99' \
            -d '{"username":"nobody","password":"wrong-password"}' http://localhost:8080/api/auth/login
          ips=$(docker compose -f docker-compose.yml -f compose.ci.yml exec -T postgres psql -U mwb -d mwb -tAc "select ip from audit_log where action='login.failed'")
          echo "audit ips: $ips"
          [ -n "$ips" ] || { echo "no login.failed audit row" | tee edge.log; exit 1; }
          if echo "$ips" | grep -q 203.0.113.99; then echo "forged X-Forwarded-For was trusted" | tee edge.log; exit 1; fi
      - if: failure()
        run: .github/scripts/annotate-tail.sh "edge" edge.log 40
      - name: Chat streams through the web proxy (curl)
        run: |
          J=$(mktemp)
          csrf=$(curl -sf -c $J -H 'content-type: application/json' -d "{\"username\":\"admin\",\"password\":\"$MWB_E2E_ADMIN_PASSWORD\"}" http://localhost:8080/api/auth/login | python3 -c "import sys,json;print(json.load(sys.stdin)['csrf_token'])")
          sid=$(curl -sf -b $J -H "X-CSRF-Token: $csrf" -H 'content-type: application/json' -d '{}' http://localhost:8080/api/chat/sessions | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -sN --max-time 30 -b $J -H "X-CSRF-Token: $csrf" -H 'content-type: application/json' -d '{"content":"hello"}' http://localhost:8080/api/chat/sessions/$sid/messages > sse.log 2>&1 || true
          cat sse.log
          grep -q "event: done" sse.log || { echo "no done event through nginx" >> sse.log; .github/scripts/annotate-tail.sh "sse via nginx" sse.log 30; }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium > /dev/null
          # Missing visual baselines are written rather than failed here; the next step reports them.
          npx playwright test --update-snapshots=missing > ../e2e.log 2>&1; status=$?; cat ../e2e.log; exit $status
      - name: Visual baselines are committed
        env:
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          new=$(git status --porcelain --untracked-files=all -- frontend/e2e | grep -- '-snapshots/' | cut -c4- || true)
          [ -z "$new" ] && exit 0
          echo "$new"
          # Baselines must come from CI's Chromium (07 §8). Commit them to the PR branch for review, and fail this
          # run: the bot's push doesn't start CI, so the next push of the PR compares against them.
          if [ "$SAME_REPO" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch -q origin "$HEAD_REF"
            git checkout -q -B baselines "origin/$HEAD_REF"
            git add -- $new
            git commit -q -m "Add visual baselines rendered by CI" -m "Review the images in this commit (docs/design/07-ux.md §8)."
            git push -q origin "HEAD:$HEAD_REF"
            echo "::error::New visual baselines were committed to $HEAD_REF. Review them in the PR, then push again (or re-run) to compare against them."
          else
            echo "::error::New visual baselines were written. Download the visual-baselines artifact and commit it under frontend/e2e/."
          fi
          exit 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: frontend/e2e/*-snapshots/
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        run: |
          docker compose -f docker-compose.yml -f compose.ci.yml logs --no-log-prefix api worker llm-gateway > all.log 2>&1
          grep -E '"status": [345][0-9][0-9]|Traceback|"level": "(warning|error)"|git\.|"path": "/api/knowledge/(search|documents/[0-9]+/visibility)"' all.log | grep -v '/api/auth/me' > services.log || true
          grep -A30 Traceback all.log > tracebacks.log || true
          grep -E 'chat\.|chat/completions' all.log | head -40 > after-chat.log || true
          .github/scripts/annotate-tail.sh "after chat request" after-chat.log 40
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T postgres psql -U mwb -d mwb -c "select pid, state, wait_event_type, wait_event, now()-xact_start as xact_age, left(query,120) from pg_stat_activity where datname='mwb' and pid <> pg_backend_pid()" > pg.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T postgres psql -U mwb -d mwb -c "select session_id, role, status, left(content,60) as content, created_at from messages order by id" >> pg.log 2>&1 || docker compose -f docker-compose.yml -f compose.ci.yml exec -T postgres psql -U mwb -d mwb -c "select session_id, role, left(content,60) as content, created_at from messages order by id" >> pg.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T postgres psql -U mwb -d mwb -c "select c.id, c.document_id, c.owner_id, c.visibility, d.visibility as doc_vis, c.embed_model, c.embedding is null as no_vec, left(c.content, 50) from chunks c join documents d on d.id = c.document_id order by c.id" >> pg.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.ci.yml logs --no-log-prefix llm-gateway | grep -v health | tail -20 > gateway.log 2>&1 || true
          wc -l all.log > all-size.log; grep -c knowledge all.log >> all-size.log || true
          .github/scripts/annotate-tail.sh "log size" all-size.log 5
          grep "\[diag\]" e2e.log > diag.log || true
          .github/scripts/annotate-tail.sh "diag" diag.log 20
          .github/scripts/annotate-tail.sh "gateway" gateway.log 20
          .github/scripts/annotate-tail.sh "pg_stat_activity" pg.log 40
          .github/scripts/annotate-tail.sh "tracebacks" tracebacks.log 80
          .github/scripts/annotate-tail.sh "stack" stack.log 60
          .github/scripts/annotate-tail.sh "playwright" e2e.log 80
          .github/scripts/annotate-tail.sh "service logs" services.log 80
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T api git --version > gitv.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T api sh -c "ls -la /data /data/wiki /data/wiki/users 2>&1; for d in /data/wiki/users/*; do git -C \$d log --oneline -5 2>&1; done" >> gitv.log 2>&1 || true
          .github/scripts/annotate-tail.sh "git" gitv.log 40
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
