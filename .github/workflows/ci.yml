name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with docker-compose.yml.
  PARADEDB_IMAGE: paradedb/paradedb:0.26.0-pg17

jobs:
  backend-lint:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check . > ../lint.log 2>&1 || { cat ../lint.log; exit 1; }
      - run: uv run --frozen ruff format --check . > ../format.log 2>&1 || { cat ../format.log; exit 1; }
      - if: failure()
        working-directory: .
        run: |
          .github/scripts/annotate-tail.sh "ruff check" lint.log
          .github/scripts/annotate-tail.sh "ruff format" format.log

  backend-test:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: paradedb/paradedb:0.26.0-pg17
        env: { POSTGRES_USER: mwb, POSTGRES_PASSWORD: mwb, POSTGRES_DB: mwb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mwb -d mwb" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MWB_DATABASE_URL: postgresql://mwb:mwb@localhost:5432/mwb
      MWB_SECRET_KEY: ci-placeholder-overridden-by-conftest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - name: pytest
        run: uv run --frozen pytest --cov=app --cov-report=term --cov-fail-under=80 -p no:cacheprovider > ../pytest.log 2>&1; status=$?; tail -n 80 ../pytest.log; exit $status
      - if: failure()
        working-directory: .
        run: .github/scripts/annotate-tail.sh "pytest" pytest.log 80

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck > ../typecheck.log 2>&1 || { cat ../typecheck.log; exit 1; }
      - run: npx vitest run --coverage > ../vitest.log 2>&1 || { cat ../vitest.log; exit 1; }
      - run: npm run build > ../build.log 2>&1 || { cat ../build.log; exit 1; }
      - if: failure()
        working-directory: .
        run: |
          for f in typecheck vitest build; do .github/scripts/annotate-tail.sh "$f" "$f.log" 40; done

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          set -o pipefail
          { docker build --target prod -t mwb-backend:prod backend \
            && docker build --target dev -t mwb-backend:dev backend \
            && docker build --target prod -t mwb-web:prod frontend; } > images.log 2>&1 || { tail -n 80 images.log; exit 1; }
      - name: Prod backend image has no dev tooling
        run: |
          if docker run --rm mwb-backend:prod python -c "import pytest" 2>/dev/null; then echo "pytest found in prod image" > images.log; exit 1; fi
          docker run --rm -e MWB_DATABASE_URL=postgresql://x@localhost/x -e MWB_SECRET_KEY=x mwb-backend:prod python -c "import app.main" > images.log 2>&1 || { cat images.log; exit 1; }
      - if: failure()
        run: .github/scripts/annotate-tail.sh "images" images.log 80

  e2e:
    runs-on: ubuntu-24.04
    needs: [images]
    env:
      MWB_E2E_ADMIN_PASSWORD: admin-password-1
    steps:
      - uses: actions/checkout@v5
      - name: Write .env
        run: |
          cp .env.example .env
          key=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres|; s|^MWB_SECRET_KEY=.*|MWB_SECRET_KEY=$key|; s|^MWB_COOKIE_SECURE=.*|MWB_COOKIE_SECURE=false|; s|^LITELLM_MASTER_KEY=.*|LITELLM_MASTER_KEY=sk-ci|" .env
      - name: Start stack with the fake LLM
        run: docker compose -f docker-compose.yml -f compose.ci.yml up -d --build --wait --wait-timeout 300 api worker web > stack.log 2>&1 || { cat stack.log; docker compose -f docker-compose.yml -f compose.ci.yml logs --tail 100 >> stack.log; exit 1; }
      - name: Create admin
        run: docker compose -f docker-compose.yml -f compose.ci.yml exec -T -e MWB_ADMIN_PASSWORD=$MWB_E2E_ADMIN_PASSWORD api mwb create-admin --username admin --email admin@example.com
      - name: Chat streams through the web proxy (curl)
        run: |
          J=$(mktemp)
          csrf=$(curl -sf -c $J -H 'content-type: application/json' -d "{\"username\":\"admin\",\"password\":\"$MWB_E2E_ADMIN_PASSWORD\"}" http://localhost:8080/api/auth/login | python3 -c "import sys,json;print(json.load(sys.stdin)['csrf_token'])")
          sid=$(curl -sf -b $J -H "X-CSRF-Token: $csrf" -H 'content-type: application/json' -d '{}' http://localhost:8080/api/chat/sessions | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -sN --max-time 30 -b $J -H "X-CSRF-Token: $csrf" -H 'content-type: application/json' -d '{"content":"hello"}' http://localhost:8080/api/chat/sessions/$sid/messages > sse.log 2>&1 || true
          cat sse.log
          grep -q "event: done" sse.log || { echo "no done event through nginx" >> sse.log; .github/scripts/annotate-tail.sh "sse via nginx" sse.log 30; }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium > /dev/null
          npx playwright test > ../e2e.log 2>&1; status=$?; cat ../e2e.log; exit $status
      - if: failure()
        run: |
          docker compose -f docker-compose.yml -f compose.ci.yml logs --no-log-prefix api worker llm-gateway > all.log 2>&1
          grep -E '"status": [345][0-9][0-9]|Traceback|"level": "(warning|error)"|git\.' all.log | grep -v '/api/auth/me' > services.log || true
          grep -A30 Traceback all.log > tracebacks.log || true
          grep -E 'chat\.|chat/completions' all.log | head -40 > after-chat.log || true
          .github/scripts/annotate-tail.sh "after chat request" after-chat.log 40
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T postgres psql -U mwb -d mwb -c "select pid, state, wait_event_type, wait_event, now()-xact_start as xact_age, left(query,120) from pg_stat_activity where datname='mwb' and pid <> pg_backend_pid()" > pg.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T postgres psql -U mwb -d mwb -c "select session_id, role, status, left(content,60) as content, created_at from messages order by id" >> pg.log 2>&1 || docker compose -f docker-compose.yml -f compose.ci.yml exec -T postgres psql -U mwb -d mwb -c "select session_id, role, left(content,60) as content, created_at from messages order by id" >> pg.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.ci.yml logs --no-log-prefix llm-gateway | grep -v health | tail -20 > gateway.log 2>&1 || true
          .github/scripts/annotate-tail.sh "gateway" gateway.log 20
          .github/scripts/annotate-tail.sh "pg_stat_activity" pg.log 40
          .github/scripts/annotate-tail.sh "tracebacks" tracebacks.log 80
          .github/scripts/annotate-tail.sh "stack" stack.log 60
          .github/scripts/annotate-tail.sh "playwright" e2e.log 80
          .github/scripts/annotate-tail.sh "service logs" services.log 80
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T api git --version > gitv.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.ci.yml exec -T api sh -c "ls -la /data /data/wiki /data/wiki/users 2>&1; for d in /data/wiki/users/*; do git -C \$d log --oneline -5 2>&1; done" >> gitv.log 2>&1 || true
          .github/scripts/annotate-tail.sh "git" gitv.log 40
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
