name: myworkbuddy

x-backend: &backend
  build:
    context: ./backend
    target: prod
  image: myworkbuddy-backend:latest
  env_file: .env
  environment: &backend-env
    MWB_DATABASE_URL: postgresql://mwb:${POSTGRES_PASSWORD}@postgres:5432/mwb
    MWB_GATEWAY_URL: http://llm-gateway:4000
    MWB_GATEWAY_KEY: ${LITELLM_MASTER_KEY}
  volumes:
    - mwbdata:/data
  restart: unless-stopped

services:
  postgres:
    image: paradedb/paradedb:0.26.0-pg17
    environment:
      POSTGRES_USER: mwb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mwb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwb -d mwb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  llm-gateway:
    image: ghcr.io/berriai/litellm:v1.103.5
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Only what the gateway needs (rule R7: it never sees MWB_SECRET_KEYS or the app database password).
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Virtual keys, budgets and spend logs live in the gateway's own database (design 01 §H12).
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      MWB_CHAT_MODEL_ID: ${MWB_CHAT_MODEL_ID}
      MWB_FAST_MODEL_ID: ${MWB_FAST_MODEL_ID}
      MWB_EMBED_MODEL_ID: ${MWB_EMBED_MODEL_ID}
      MWB_PLANNER_MODEL_ID: ${MWB_PLANNER_MODEL_ID:-${MWB_CHAT_MODEL_ID}}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
    depends_on:
      migrate:  # creates the litellm role and database
        condition: service_completed_successfully
    volumes:
      - ./gateway/litellm.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: database bootstrap + Alembic. api and worker start only after it exits 0.
  migrate:
    <<: *backend
    command: ["sh", "-c", "mwb db-bootstrap && alembic upgrade head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    networks: [default, edge]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=172.30.0.200"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      llm-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      # Background tasks run longer statements and need fewer connections than the API (design 01 §H6).
      MWB_DB_STATEMENT_TIMEOUT_MS: "300000"
      MWB_DB_POOL_SIZE: "6"
    command: ["sh", "-c", "mwb check-config && { mwb wiki-reconcile || echo wiki-reconcile failed, continuing; } && exec procrastinate --app=app.tasks.app.app worker --concurrency=4"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: prod
    image: myworkbuddy-web:latest
    networks: [edge]
    restart: unless-stopped

  # The only published service: TLS, security headers, routing (deploy/caddy/Caddyfile).
  caddy:
    image: caddy:2-alpine
    environment:
      MWB_HOSTNAME: ${MWB_HOSTNAME:?set MWB_HOSTNAME in .env}
      MWB_TLS_MODE: ${MWB_TLS_MODE:-files}
      # Strict CSP. Remote images are blocked here as a backstop to the Markdown renderer (H4).
      MWB_CSP: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ./deploy/tls:/tls:ro
      - caddydata:/data
    networks:
      edge:
        # uvicorn trusts X-Forwarded-For only from this address (--forwarded-allow-ips).
        ipv4_address: 172.30.0.200
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

networks:
  default:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Automatic addresses come from the lower half, so Caddy's fixed .200 is never taken.
          ip_range: 172.30.0.0/25

volumes:
  pgdata:
  mwbdata:
  caddydata:
